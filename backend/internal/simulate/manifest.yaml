name: simulate
version: 1.0.0
purpose: >-
  Package simulate implements the Simulation Lab: saved "what if" scenarios and the runs that compute them.
language: go
runtime: library
entry_points: []
public_api:
  - type CatalogEntry
  - type CreateScenarioInput
  - type ParamSpec
  - type PreviewInput
  - type PreviewResult
  - type Run
  - type RunInput
  - type Scenario
  - type Service
depends_on:
  - analytics
  - audit
  - crm
  - database
  - rbac
external_deps:
  - github.com/google/uuid
requires_env: []
database:
  tables: []            # владение данными — логическое, см. audit/DEPENDENCY_MAP.md
  migrations: []        # общие встроенные миграции internal/migrations
events:
  emits: []
  consumes: []
api: []                 # HTTP-маршруты объявлены в internal/api (композиция)
portable: true          # доказано scripts/extract-test
extract_status: verified
