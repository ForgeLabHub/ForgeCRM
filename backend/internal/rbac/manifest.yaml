name: rbac
version: 1.0.0
purpose: >-
  Package rbac defines the permission catalog and the authorization checks that every API and MCP tool must go through.
language: go
runtime: library
entry_points: []
public_api:
  - func Known
  - type Permission
  - type Principal
  - type Role
  - type Service
depends_on:
  - database
external_deps:
  - github.com/google/uuid
requires_env: []
database:
  tables: []            # владение данными — логическое, см. audit/DEPENDENCY_MAP.md
  migrations: []        # общие встроенные миграции internal/migrations
events:
  emits: []
  consumes: []
api: []                 # HTTP-маршруты объявлены в internal/api (композиция)
portable: true          # доказано scripts/extract-test
extract_status: verified
