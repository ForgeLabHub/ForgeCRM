services:
  # Backend API Web Service
  - type: web
    name: forgecrm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: FORGECRM_ENV
        value: production
      - key: FORGECRM_LOG_LEVEL
        value: info
      - key: FORGECRM_LOG_FORMAT
        value: json
      - key: FORGECRM_HTTP_ADDR
        value: ":8080"
      - key: FORGECRM_MIGRATE_ON_START
        value: "true"
      - key: FORGECRM_DATABASE_URL
        fromDatabase:
          name: forgecrm-db
          property: connectionString
      - key: FORGECRM_SECRET_KEY
        generateValue: true

  # Background Worker
  - type: worker
    name: forgecrm-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /usr/local/bin/forgecrm-worker
    region: oregon
    plan: starter
    envVars:
      - key: FORGECRM_ENV
        value: production
      - key: FORGECRM_LOG_LEVEL
        value: info
      - key: FORGECRM_LOG_FORMAT
        value: json
      - key: FORGECRM_DATABASE_URL
        fromDatabase:
          name: forgecrm-db
          property: connectionString
      - key: FORGECRM_SECRET_KEY
        fromService:
          type: web
          name: forgecrm-api
          envVarKey: FORGECRM_SECRET_KEY

  # Frontend Static Site
  - type: static
    name: forgecrm-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: forgecrm-api
          property: host

databases:
  - name: forgecrm-db
    databaseName: forgecrm
    user: forgecrm
    region: oregon
    plan: starter
