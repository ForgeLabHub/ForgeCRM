<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach into the notch and the home
         indicator area; the safe-area insets are then applied in CSS. Without
         it, a notched phone letterboxes the whole app in a white frame. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Two theme colours so the browser chrome matches the page in either mode
         instead of tinting a dark screen with the light accent. -->
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1219" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ForgeCRM — the ForgeLabHub business platform: CRM, automation, analytics and intelligence in one workspace." />
    <title>ForgeCRM</title>
    <script>
      /*
       * Applies the saved theme before the first paint so the page never flashes
       * the wrong colours. It is inline and runs before the bundle because any
       * deferred script would run after the first frame. It mirrors the logic in
       * src/theme: the stored mode wins, "system" follows the OS, and anything
       * unreadable falls back to the system preference. A failure here must not
       * break the page, so it is wrapped in try/catch.
       */
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('forgecrm.theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;

          /* The style, accent and density are written from storage here too, for
             the same reason: a named style replaces the base palette, so applying
             it after the first frame would flash the default colours first. Only
             values the app knows are applied; anything else is ignored, and the
             provider corrects it on mount. */
          var styles = ['default', 'minimal', 'midnight', 'glass', 'premium', 'brutalist', 'cyberpunk', 'soft', 'editorial', 'warm', 'colorful'];
          var accents = ['theme', 'indigo', 'emerald', 'amber', 'rose', 'cyan'];
          var densities = ['compact', 'standard', 'spacious'];
          function pick(key, allowed) {
            var v = localStorage.getItem(key);
            return allowed.indexOf(v) >= 0 ? v : null;
          }
          var style = pick('forgecrm.style', styles);
          if (style) root.setAttribute('data-style', style);
          var accent = pick('forgecrm.accent', accents);
          if (accent) root.setAttribute('data-accent', accent);
          var density = pick('forgecrm.density', densities);
          if (density) root.setAttribute('data-density', density);
        } catch (e) {
          /* storage unavailable: the stylesheet default applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
