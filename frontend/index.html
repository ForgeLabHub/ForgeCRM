<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach into the notch and the home
         indicator area; the safe-area insets are then applied in CSS. Without
         it, a notched phone letterboxes the whole app in a white frame. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Two theme colours so the browser chrome matches the page in either mode
         instead of tinting a dark screen with the light accent. -->
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1219" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ForgeCRM — the ForgeLabHub business platform: CRM, automation, analytics and intelligence in one workspace." />
    <title>ForgeCRM</title>
    <script>
      /* Use a neutral system palette until the signed-in account is known.
         The interface experience, though, is a device-local choice: restore it
         now so a returning device never paints the classic frame first. */
      (function () {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        try {
          var layout = window.localStorage.getItem('forgecrm.layout');
          if (layout === 'stratus' || layout === 'horizon' || layout === 'pulse' || layout === 'slate') {
            document.documentElement.setAttribute('data-layout', layout);
          }
        } catch (e) { /* storage unavailable: the provider applies it later */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
