# Reverse proxy for ForgeCRM.
#
# The API is the only upstream. Request bodies are streamed to disk by the API,
# so the upload limit here must be at least FORGECRM_IMPORT_MAX_UPLOAD_BYTES.

upstream forgecrm_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Match the Import Center upload ceiling. Keep in sync with
    # FORGECRM_IMPORT_MAX_UPLOAD_BYTES.
    client_max_body_size 256m;
    client_body_timeout 300s;

    # Do not advertise the server implementation.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        proxy_pass http://forgecrm_api;
        access_log off;
    }

    location / {
        proxy_pass http://forgecrm_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Imports and exports can legitimately take a while.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
