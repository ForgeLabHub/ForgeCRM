# Reverse proxy for the two-replica rehearsal.
#
# The point of this proxy in the rehearsal is that it is real: it terminates the
# TCP connection, so the API's peer address is the proxy and the client address
# arrives only in X-Forwarded-For. A test that talked to the API directly would
# never exercise the trusted-proxy path at all.
#
# Requests are spread across both replicas so that a session or a rate-limit
# counter that is not actually shared fails the rehearsal.

upstream forgecrm_replicas {
    # Round-robin across both replicas. No sticky sessions: a session must work on
    # whichever replica the client lands on, which is exactly what is being tested.
    server api-a:8080 max_fails=0;
    server api-b:8080 max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256m;
    client_body_timeout 300s;
    server_tokens off;

    # Every response says which replica produced it, so a test can prove that
    # requests really did land on more than one. The rehearsal sets this itself;
    # a production deployment would not.
    add_header X-ForgeCRM-Replica $upstream_addr always;

    location /health {
        proxy_pass http://forgecrm_replicas;
        access_log off;
    }

    location / {
        proxy_pass http://forgecrm_replicas;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }
}
