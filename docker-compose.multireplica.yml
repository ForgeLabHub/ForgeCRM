# Two API replicas behind nginx, sharing one PostgreSQL and one Redis.
#
# This is the topology that makes a distributed rate limit and a shared account
# lockout observable. `docker compose up` runs a single API and is unaffected;
# this file exists only for the rehearsal:
#
#   scripts/multi-replica-verify.sh
#
# Everything here is isolated from the default stack: a separate project name,
# separate ports and a separate database, so a rehearsal cannot touch developer
# data. The credentials are throwaway values that exist only for this topology.
#
# The two replicas differ only in name and published port. They share the same
# image, the same database and the same Redis, which is the point: any behaviour
# that differs between them is behaviour that is not actually shared.

name: forgecrm-multireplica

services:
  postgres:
    image: postgres:17-alpine
    networks: [rehearsal]
    environment:
      POSTGRES_USER: forgecrm
      POSTGRES_PASSWORD: forgecrm
      POSTGRES_DB: forgecrm
    volumes:
      - mrpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgecrm -d forgecrm"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    networks: [rehearsal]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The first replica applies migrations; the second waits for it to be healthy.
  # golang-migrate takes an advisory lock, so even a simultaneous start would be
  # safe, but serialising them keeps the startup log unambiguous.
  api-a:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: multireplica
        COMMIT: rehearsal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FORGECRM_ENV: development
      FORGECRM_HTTP_ADDR: ":8080"
      FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@postgres:5432/forgecrm?sslmode=disable
      FORGECRM_SECRET_KEY: rehearsal-secret-key-shared-by-both-replicas-0000
      FORGECRM_MIGRATE_ON_START: "true"
      # Shared counters: without this each replica enforces its own budget and the
      # login limit would be multiplied by two.
      FORGECRM_RATE_LIMIT_STORE: redis
      FORGECRM_REDIS_URL: redis://redis:6379/0
      FORGECRM_RATE_LIMIT_PER_MIN: "1000"
      FORGECRM_LOGIN_RATE_LIMIT_PER_MIN: "2"
      FORGECRM_LOCKOUT_THRESHOLD: "3"
      FORGECRM_LOCKOUT_WINDOW: 30s
      # nginx is the only trusted peer, named by its address on the rehearsal
      # network. Nothing else on this network is trusted, so a client that reaches
      # a replica directly — as the rehearsal does through the published port — has
      # its X-Forwarded-For ignored and is attributed to its own address. Trusting a
      # whole private range would be wrong here: the test host's own address falls
      # inside 172.16.0.0/12, which would make the spoofing check pass vacuously.
      FORGECRM_TRUSTED_PROXIES: 172.28.0.10
      FORGECRM_LOG_LEVEL: info
    networks:
      rehearsal:
        ipv4_address: 172.28.0.11
    ports:
      - "18081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  api-b:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: multireplica
        COMMIT: rehearsal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-a:
        condition: service_healthy
    environment:
      FORGECRM_ENV: development
      FORGECRM_HTTP_ADDR: ":8080"
      FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@postgres:5432/forgecrm?sslmode=disable
      FORGECRM_SECRET_KEY: rehearsal-secret-key-shared-by-both-replicas-0000
      # Only replica A migrates. A second migrator would be harmless because of the
      # advisory lock, but there is no reason to run one.
      FORGECRM_MIGRATE_ON_START: "false"
      FORGECRM_RATE_LIMIT_STORE: redis
      FORGECRM_REDIS_URL: redis://redis:6379/0
      FORGECRM_RATE_LIMIT_PER_MIN: "1000"
      FORGECRM_LOGIN_RATE_LIMIT_PER_MIN: "2"
      FORGECRM_LOCKOUT_THRESHOLD: "3"
      FORGECRM_LOCKOUT_WINDOW: 30s
      FORGECRM_TRUSTED_PROXIES: 172.28.0.10
      FORGECRM_LOG_LEVEL: info
    networks:
      rehearsal:
        ipv4_address: 172.28.0.12
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  # A real reverse proxy, not a stub. It terminates the connection, so the API
  # sees the proxy's address as its peer and only the forwarding headers carry
  # the client's — which is the situation FORGECRM_TRUSTED_PROXIES exists for.
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api-a:
        condition: service_started
      api-b:
        condition: service_started
    networks:
      rehearsal:
        ipv4_address: 172.28.0.10
    ports:
      - "18080:80"
    volumes:
      - ./deploy/nginx-multireplica.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

networks:
  # A dedicated subnet with static addresses, so the trusted peer is a single
  # known address rather than a range that also contains the test host.
  rehearsal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mrpgdata:
