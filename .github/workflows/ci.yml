name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same ref cancels the previous run, which keeps the queue
# short without hiding failures: the newest commit is the one that matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

jobs:
  backend:
    name: Backend (format, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Integration tests run against a real database, not a mock.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgecrm
          POSTGRES_PASSWORD: forgecrm
          POSTGRES_DB: forgecrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgecrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        # Tests that need a database skip themselves when the URL is unset, so
        # this step is meaningful only because the service above is provided.
        env:
          FORGECRM_TEST_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_test?sslmode=disable
        run: go test -count=1 -tags=integration ./...

      - name: Build
        run: |
          go build -trimpath -o /dev/null ./cmd/forgecrm-api
          go build -trimpath -o /dev/null ./cmd/forgecrm-worker

      - name: Migrations apply cleanly on an empty database
        env:
          FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_test?sslmode=disable
          FORGECRM_SECRET_KEY: ci-secret-key-not-used-in-production-000000
          FORGECRM_ENV: development
        run: |
          go build -o /tmp/forgecrm-api ./cmd/forgecrm-api
          /tmp/forgecrm-api -migrate
          /tmp/forgecrm-api -migrate   # a second run must be a no-op

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the locked tree, so CI cannot silently pass on
      # a different dependency version than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (real API, real database, real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgecrm
          POSTGRES_PASSWORD: forgecrm
          POSTGRES_DB: forgecrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgecrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_e2e?sslmode=disable
      FORGECRM_SECRET_KEY: e2e-secret-key-long-enough-for-hkdf-derivation-0000
      FORGECRM_ENV: development
      FORGECRM_HTTP_ADDR: 127.0.0.1:8080
      # The suite signs in repeatedly from one address and drives many requests
      # through the API. The production budgets are correct for production, so
      # they are raised here rather than weakened in the product.
      FORGECRM_RATE_LIMIT_PER_MIN: "100000"
      FORGECRM_LOGIN_RATE_LIMIT_PER_MIN: "100000"
      FORGECRM_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build the API and apply migrations
        working-directory: backend
        run: |
          go build -o forgecrm-api ./cmd/forgecrm-api
          ./forgecrm-api -migrate

      - name: Provision the E2E platform owner
        working-directory: .
        run: ./scripts/e2e-bootstrap.sh

      - name: Start the API
        working-directory: backend
        run: |
          nohup ./forgecrm-api > /tmp/forgecrm-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready; log follows"
          cat /tmp/forgecrm-api.log
          exit 1

      # Playwright starts the Vite dev server itself (see webServer in
      # playwright.config.ts), so there is no separate step for it.
      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security (dependencies, secrets, static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan more than the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static analysis (gosec)
        working-directory: backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # G104 is unchecked errors, which go vet partly covers; the noise is
          # not worth failing the build on.
          gosec -exclude=G104 -fmt=text ./... || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # BuildKit's cache backend avoids rebuilding dependencies each run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Required documentation is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required files
        run: |
          missing=0
          # LICENSE is deliberately absent from this list: the distribution
          # model is an owner decision, not something CI should force.
          required=(
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            docs/PROJECT_AUDIT.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/ACCEPTANCE_CRITERIA.md
            docs/development/frontend.md
          )
          for f in "${required[@]}"; do
            if [[ -s "${f}" ]]; then
              echo "ok    ${f}"
            else
              echo "fail  ${f} is missing or empty"
              missing=$((missing + 1))
            fi
          done
          if [[ ${missing} -gt 0 ]]; then
            echo "${missing} required file(s) missing"
            exit 1
          fi
