name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push to the same ref cancels the previous run, which keeps the queue
# short without hiding failures: the newest commit is the one that matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

jobs:
  backend:
    name: Backend (format, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Integration tests run against a real database, not a mock.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgecrm
          POSTGRES_PASSWORD: forgecrm
          POSTGRES_DB: forgecrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgecrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        # The distributed limiter is tested against a real server, because the
        # properties that matter — atomic increment and a window shared between
        # processes — are the ones a fake would satisfy by construction. Tests
        # that need it skip when FORGECRM_TEST_REDIS_URL is unset.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: OpenAPI specification is current
        # The specification is generated from the live router, so this step fails
        # when a route is added, renamed or removed without regenerating
        # docs/api/openapi.json. It is the enforcement half of the generator: the
        # generator makes the document correct, this keeps it correct.
        run: go run ./cmd/openapi-gen -check

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        # Tests that need a database skip themselves when the URL is unset, so
        # this step is meaningful only because the service above is provided.
        #
        # -p 1 is required, not a preference: the integration packages share one
        # database and each resets the schema in its setup, so running them in
        # parallel makes one package drop the tables another is seeding
        # ("relation \"users\" does not exist").
        env:
          FORGECRM_TEST_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_test?sslmode=disable
          FORGECRM_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: go test -count=1 -p 1 -tags=integration ./...

      - name: Build
        run: |
          go build -trimpath -o /dev/null ./cmd/forgecrm-api
          go build -trimpath -o /dev/null ./cmd/forgecrm-worker

      - name: Migrations apply cleanly on an empty database
        env:
          FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_test?sslmode=disable
          FORGECRM_SECRET_KEY: ci-secret-key-not-used-in-production-000000
          FORGECRM_ENV: development
        run: |
          go build -o /tmp/forgecrm-api ./cmd/forgecrm-api
          /tmp/forgecrm-api -migrate
          /tmp/forgecrm-api -migrate   # a second run must be a no-op

  extraction:
    name: Extraction (each module builds without the monolith)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # "Extraction-ready" is only a fact if removing the monolith still leaves the
      # module working. This job does exactly that: it copies each module in
      # scripts/extract-test/modules.txt into a clean Go module and builds, tests and
      # runs it there. The archtest enforces the same boundary cheaply on every
      # `go test`; this is the version that cannot be fooled by a stale import list.
      - name: Run the extraction harness
        run: ./scripts/extract-test/run.sh

  constructor:
    name: Constructor (each recipe builds a working project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # The extraction harness proves a package can stand alone. This proves the
      # constructor turns a recipe into a project someone can actually use: it runs
      # `forgecrm scaffold` for every recipe, then builds, tests and runs the
      # generated project, checking the demo's deterministic output. A recipe that
      # generates a project which does not build fails here and not in a user's hands.
      - name: Run the constructor harness
        run: ./scripts/constructor-test/run.sh

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the locked tree, so CI cannot silently pass on
      # a different dependency version than a developer has.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (real API, real database, real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forgecrm
          POSTGRES_PASSWORD: forgecrm
          POSTGRES_DB: forgecrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgecrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FORGECRM_DATABASE_URL: postgres://forgecrm:forgecrm@127.0.0.1:5432/forgecrm_e2e?sslmode=disable
      # Not a secret: a fixed, obviously fake value used only by this job. It is
      # written as a repeated literal rather than a random-looking string so the
      # `generic-api-key` gitleaks rule does not read it as a leaked credential.
      FORGECRM_SECRET_KEY: e2e-only-e2e-only-e2e-only-e2e-only-e2e-only
      FORGECRM_ENV: development
      FORGECRM_HTTP_ADDR: 127.0.0.1:8080
      # The suite signs in repeatedly from one address and drives many requests
      # through the API. The production budgets are correct for production, so
      # they are raised here rather than weakened in the product.
      FORGECRM_RATE_LIMIT_PER_MIN: "100000"
      FORGECRM_LOGIN_RATE_LIMIT_PER_MIN: "100000"
      FORGECRM_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build the API and apply migrations
        working-directory: backend
        run: |
          go build -o forgecrm-api ./cmd/forgecrm-api
          ./forgecrm-api -migrate

      - name: Provision the E2E platform owner
        working-directory: .
        run: ./scripts/e2e-bootstrap.sh

      - name: Start the API
        working-directory: backend
        run: |
          nohup ./forgecrm-api > /tmp/forgecrm-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready; log follows"
          cat /tmp/forgecrm-api.log
          exit 1

      # Playwright starts the Vite dev server itself (see webServer in
      # playwright.config.ts), so there is no separate step for it.
      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security (dependencies, secrets, static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan more than the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # gitleaks-action@v2 требует платную лицензию для организаций и без
      # GITLEAKS_LICENSE падает, ничего не проверив. Тот же gitleaks
      # закреплённой версии запускается напрямую: воспроизводимо и без секретов.
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan for committed secrets
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner -v .

      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static analysis (gosec)
        working-directory: backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # G104 is unchecked errors, which go vet partly covers; the noise is
          # not worth failing the build on.
          gosec -exclude=G104 -fmt=text ./... || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # BuildKit's cache backend avoids rebuilding dependencies each run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: Required documentation is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required files
        run: |
          missing=0
          # LICENSE is deliberately absent from this list: the distribution
          # model is an owner decision, not something CI should force.
          required=(
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            docs/PROJECT_AUDIT.md
            docs/ARCHITECTURE.md
            docs/ROADMAP.md
            docs/ACCEPTANCE_CRITERIA.md
            docs/development/frontend.md
            docs/deployment/environment-variables.md
          )
          for f in "${required[@]}"; do
            if [[ -s "${f}" ]]; then
              echo "ok    ${f}"
            else
              echo "fail  ${f} is missing or empty"
              missing=$((missing + 1))
            fi
          done
          if [[ ${missing} -gt 0 ]]; then
            echo "${missing} required file(s) missing"
            exit 1
          fi
