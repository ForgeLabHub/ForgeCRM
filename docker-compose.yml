# ForgeCRM — reproducible local and single-host deployment.
#
#   cp .env.example .env && edit .env
#   docker compose up -d
#
# The API applies migrations on start only when FORGECRM_MIGRATE_ON_START=true;
# the code default is false. .env.example sets it to true so a local
# `docker compose up` migrates in one step; .env is read below via env_file.
# Create the first administrator once, after the API is healthy. The password is
# supplied through the environment so it never lands in the process list:
#   FORGECRM_BOOTSTRAP_PASSWORD='...' docker compose run --rm --no-deps \
#     -e FORGECRM_BOOTSTRAP_PASSWORD api -bootstrap-admin -bootstrap-email you@example.com

name: forgecrm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgecrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecrm}
      POSTGRES_DB: ${POSTGRES_DB:-forgecrm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API and worker wait for this, so a slow start cannot race migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgecrm} -d ${POSTGRES_DB:-forgecrm}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Not published by default: the database is reachable only on the internal
    # network. Uncomment for local debugging.
    # ports:
    #   - "5432:5432"

  # Redis is optional and opt-in through the "redis" profile, so the default
  # `docker compose up` starts nothing extra. Enable it when running more than
  # one API replica, and set FORGECRM_RATE_LIMIT_STORE=redis and
  # FORGECRM_REDIS_URL=redis://redis:6379/0 in .env. Without it each replica
  # enforces its own copy of the rate limit.
  #
  #   docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      # Built from the repository root so the image also contains the web
      # interface (see the root Dockerfile). A platform that builds the repo root,
      # such as blitz.cloud, reads this file to find the parts and builds the same
      # image; the API serves the interface and the API from one container.
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${FORGECRM_VERSION:-dev}
        COMMIT: ${FORGECRM_COMMIT:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # .env is the local override; it is absent on a managed platform that injects
    # its own variables, so a missing file is not an error.
    env_file:
      - path: .env
        required: false
    environment:
      FORGECRM_HTTP_ADDR: ":8080"
      # The interface is copied here by the root Dockerfile.
      FORGECRM_STATIC_DIR: "/app/public"
    volumes:
      # Uploads and extracted archives persist across restarts.
      - importdata:/var/lib/forgecrm
    ports:
      - "${FORGECRM_HTTP_PORT:-8080}:8080"
    healthcheck:
      # Alpine ships busybox wget; no extra tooling is installed in the image.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${FORGECRM_VERSION:-dev}
        COMMIT: ${FORGECRM_COMMIT:-}
    restart: unless-stopped
    # The worker shares the API image and runs the other binary. The entrypoint
    # dispatcher reads FORGECRM_ROLE or its first argument and starts the worker.
    #
    # Both signals are set because platforms differ in what they carry over from
    # this file. Compose honours `entrypoint` and `environment`; blitz.cloud
    # ignores `entrypoint` and maps `command` to its per-part "start command"
    # instead, which it appends to the image ENTRYPOINT. With the bare
    # FORGECRM_ROLE alone, a platform that drops compose `environment` runs a
    # second API on this part and no background job is processed.
    entrypoint: ["/usr/local/bin/forgecrm-entrypoint"]
    command: ["worker"]
    environment:
      FORGECRM_ROLE: worker
    # On SIGTERM the worker stops claiming and waits up to FORGECRM_WORKER_SHUTDOWN_GRACE
    # (30s by default) for the job in hand. Docker's own default of 10s would SIGKILL
    # it first, leaving that job's row 'running' until the requeue sweep recovers it.
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # The API applies migrations, so the worker must not start first.
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - importdata:/var/lib/forgecrm

  # The Telegram bot runs as its own service so it can be deployed, scaled and
  # restarted without the API or the worker. It long-polls the Bot API, so it
  # needs no public webhook and no published port. It is inert unless
  # FORGECRM_TELEGRAM_ENABLED=true and a bot token are set; without a token the
  # binary exits, which keeps a half-configured deployment from running an
  # unauthenticated process.
  #
  #   FORGECRM_TELEGRAM_ENABLED=true
  #   FORGECRM_TELEGRAM_BOT_TOKEN=<secret>
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${FORGECRM_VERSION:-dev}
        COMMIT: ${FORGECRM_COMMIT:-}
    restart: unless-stopped
    # The entrypoint dispatcher reads FORGECRM_ROLE or its first argument and
    # starts the bot. Both signals are set for the same reason as the worker:
    # platforms differ in what they carry over from this file.
    entrypoint: ["/usr/local/bin/forgecrm-entrypoint"]
    command: ["telegram"]
    environment:
      FORGECRM_ROLE: telegram
      # A health server so an orchestrator can restart a wedged bot. It is bound
      # to the container only; it is not published.
      FORGECRM_TELEGRAM_HEALTH_ADDR: ":8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/readyz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        # The API applies migrations; the bot must not poll before the schema is
        # ready (it also waits for it, but ordering avoids a needless retry loop).
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    stop_grace_period: 20s

  # Optional reverse proxy. Enable with: docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FORGECRM_PROXY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  importdata:
